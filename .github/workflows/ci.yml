name: uvp-core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: uvp-core-ci-.github
  cancel-in-progress: false

jobs:
  rust:
    runs-on: ubuntu-latest
    # 无人值守面的挂死兜底；rust 面含冷启动 cargo 构建，预算高于常规门。
    timeout-minutes: 60
    env:
      # 约束注册表单源在 uvp-protocol 仓，独立 checkout 的 CI 按环境变量取文件
      UVP_CONSTRAINTS_PATH: ${{ github.workspace }}/uvp-protocol/protocol/uvp-constraints.v1.json
    steps:
      - uses: actions/checkout@v4
      - name: Checkout uvp-protocol
        uses: actions/checkout@v4
        with:
          repository: conucleus/uvp-protocol
          path: uvp-protocol
          # 协议联动 PR 用同名分支验证真实组合；非 PR 检默认分支
          #（协议仓无 pin 载体，默认分支即其发布面）。
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  node-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # 无人值守面的挂死兜底。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native package
        working-directory: crates/uvp-node
        run: node ./scripts/build-native.mjs --release
      - name: Test native package
        working-directory: crates/uvp-node
        run: node --test ./test/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: uvp-core-node-${{ runner.os }}-${{ runner.arch }}
          path: crates/uvp-node/uvp_node.node
          if-no-files-found: error
